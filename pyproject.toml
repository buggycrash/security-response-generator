[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-response-generator"
version = "0.1.0"
description = "Local RAG CLI that drafts security control responses from NIST baseline, customer standards, and private system context"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Rob Fink" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "ollama>=0.4",
    "chromadb>=0.5",
    "pypdf>=4.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/buggycrash/security-response-generator"
Issues = "https://github.com/buggycrash/security-response-generator/issues"
Source = "https://github.com/buggycrash/security-response-generator"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[project.scripts]
srg = "security_response_generator.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_response_generator = ["evaluation_data/*.json"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
